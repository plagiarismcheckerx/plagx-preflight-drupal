plagx_draft_preflight.settings:
  type: config_object
  label: 'Plagx Draft Preflight settings'
  mapping:
    min_words:
      type: integer
      label: 'Minimum words'
    max_words:
      type: integer
      label: 'Maximum words'
    style:
      type: string
      label: 'Citation style'
    checks:
      type: sequence
      label: 'Checks'
      sequence:
        type: string
        label: 'Check'
